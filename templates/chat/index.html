{% extends "components/bs-base.html" %}
{% set form_options = {} %}

{% block title %}Chat{% endblock %}

{% block extra_css %}
    <style>
        .chat-wrapper {
            max-width: 700px;
            margin: 2rem auto;
            background: var(--bs-body-bg);
            border-radius: 1rem;
            box-shadow: 0 2px 16px var(--bs-border-color);
            display: flex;
            flex-direction: column;
            height: 80vh;
        }
        .chat-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--bs-border-color);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: var(--bs-tertiary-bg);
            border-radius: 1rem 1rem 0 0;
        }
        .user-info h2 {
            font-size: 1.1rem;
            margin: 0;
        }
        .room-selector {
            min-width: 200px;
        }
        #chat-box {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 1rem 1.5rem;
            background: var(--bs-body-bg);
        }
        #message-form {
            display: flex;
            gap: 0.5rem;
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--bs-border-color);
            background: var(--bs-tertiary-bg);
            border-radius: 0 0 1rem 1rem;
        }
        #message {
            flex: 1 1 auto;
            border-radius: 2rem;
            border: 1px solid var(--bs-border-color);
            padding: 0.5rem 1rem;
            background: var(--bs-body-bg);
            color: var(--bs-body-color);
        }
        #send-button {
            border-radius: 2rem;
            padding: 0.5rem 1.5rem;
        }
        .system-message {
            text-align: center;
            color: var(--bs-secondary-color);
            font-size: 0.9rem;
            margin: 0.5rem 0;
        }
        .message {
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
        }
        .message.right {
            align-items: flex-end;
        }
        .message.left {
            align-items: flex-start;
        }
        .bubble {
            max-width: 70%;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            position: relative;
        }
        .bubble.right {
            background: var(--bs-success-bg-subtle);
            color: var(--bs-success-text);
        }
        .bubble.left {
            background: var(--bs-danger-bg-subtle);
            color: var(--bs-danger-text);
        }
        .sender-info {
            font-size: 0.85rem;
            color: var(--bs-secondary-color);
            margin-bottom: 0.2rem;
        }
        .timestamp {
            font-size: 0.75rem;
            color: var(--bs-secondary-color);
            margin-top: 0.2rem;
            text-align: right;
        }
        @media (max-width: 600px) {
            .chat-wrapper {
                max-width: 100vw;
                height: 100vh;
                border-radius: 0;
            }
            .chat-header, #message-form {
                padding: 0.5rem;
            }
            #chat-box {
                padding: 0.5rem;
            }
        }
    </style>
{% endblock %}

{% block extra_head_js %}
    <script src="{{ url_for('static', filename='vend/socket.io/4.4.1/socket.io.min.js')}}"></script>
{% endblock %}

{% block content %}
<div class="chat-wrapper">
    <div class="chat-header">
        <div class="user-info">
            <h2>
                <span class="me-2">Chatting as</span>
                <strong>{{ current_user.name }}</strong>
            </h2>
        </div>
        <div class="room-selector">
            <label for="room-select" class="form-label mb-0">Room:</label>
            <select id="room-select" class="form-select form-select-sm">
                {% for room in chat_rooms %}
                    <option value="{{ room.id }}" {% if room.default %}selected{% endif %}>{{ room.name }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div id="chat-box" class="scrollbar-custom" aria-live="polite"></div>

    <form id="message-form" autocomplete="off">
        <input type="text" 
               id="message" 
               placeholder="Type your message..." 
               autocomplete="off"
               class="form-control"
               required>
        <button type="submit" id="send-button" class="btn btn-primary">
            <i class="bi bi-send"></i> <span class="d-none d-sm-inline">Send</span>
        </button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    window.chatConfig = {
        nick_name: "{{ nick_name if nick_name is not none else ''}}",
        sender: "{{ current_user.name if current_user is not none else ''}}"
    };
</script>
<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
{% endblock %}
