{% extends "bs_base.html" %}

{% block content %}
<div class="profile-container">
    <h2 class="profile-title">User Profile</h2>
    
    <div class="profile-card">
        <div class="profile-section">
            <h3 class="section-title">Account Information</h3>
            <div class="profile-info">
                <div class="info-item">
                    <span class="info-label">Username:</span>
                    <span class="info-value">{{ current_user.name }}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Person:</span>
                    <span class="info-value">{{ current_user.person }}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Roles:</span>
                    <span class="info-value">{{ current_user.roles | map(attribute='name') | join(', ') }}</span>
                </div>
            </div>
        </div>
    </div>

    <div class="profile-card">
        <div class="profile-section">
            <h3 class="section-title">Change Password</h3>
            <form method="POST" action="{{ url_for('auth.change_password') }}" class="password-form">
                <div class="form-group">
                    <label for="current_password">Current Password</label>
                    <input type="password" id="current_password" name="current_password" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="new_password">New Password</label>
                    <input type="password" id="new_password" name="new_password" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm New Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">Change Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
