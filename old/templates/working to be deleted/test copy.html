<!doctype html>
{% set username = 'John Doe' %}
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}My Flask App{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      padding-top: 56px;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">nDART</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" 
              aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-between" id="navbarContent">
        <!-- Left section -->
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="#">{{ username }}</a>
          </li>
          <li class="nav-item">
            <a  class="nav-link" href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
          </li>
        </ul>

        <!-- Right section -->
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="{{ url_for('main_bp.dashboard') }}"> Dashboard </a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('main_bp.events') }}"> Events </a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('main_bp.observations') }}"> Observations </a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('main_bp.station_statuses') }}"> Station Statuses </a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('chat') }}"> Chat </a></li>
            {% if is_admin %}
                <li class="nav-item"><a class="nav-link" href="{{ url_for('admin') }}"> Admin </a></li>
            {% endif %}


        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container mt-4">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
