services:
  ndart:
    build: .
    container_name: ndart-gunicorn-gevent
    ports:
      - "9030:5000" # Expose on host port 9030, internal app port 5000
    environment:
      - FLASK_APP=wsgi_gevent.py
      - FLASK_ENV=production
      - NDART_HOST=0.0.0.0
      - FLASK_PORT=5000 # Internal port for Gunicorn
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - NDART_DEBUG=${NDART_DEBUG:-False}
      - LOGGING_PATH=/app/log
      - LOGGING_LEVEL=${LOGGING_LEVEL:-20}
    command: [
      "gunicorn",
      "-k", "gevent",
      "-w", "1",
      "--worker-connections", "1000",
      "--bind", "0.0.0.0:5000",
      "--timeout", "120",
      "--keep-alive", "5",
      "--max-requests", "1000",
      "--max-requests-jitter", "100",
      "--preload",
      "wsgi_gevent:application"
    ]
    volumes:
      - ./db:/app/db
      - ./logs:/app/log
      # To use your existing production database, uncomment and modify:
      # - /path/to/your/production/database.db:/app/db/app.db:ro  # Read-only
      # - /path/to/your/production/database.db:/app/db/app.db      # Read-write
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"] # Health check on internal port
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

networks:
  default:
    name: ndart-gunicorn-gevent-network
