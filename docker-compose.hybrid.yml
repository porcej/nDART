services:
  # Main Flask application with Gunicorn
  ndart-web:
    build: .
    container_name: ndart-web
    ports:
      - "9030:5000" # Web application
    environment:
      - FLASK_APP=wsgi.py
      - FLASK_ENV=production
      - NDART_HOST=0.0.0.0
      - FLASK_PORT=5000
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - NDART_DEBUG=${NDART_DEBUG:-False}
      - LOGGING_PATH=/app/log
      - LOGGING_LEVEL=${LOGGING_LEVEL:-20}
    command: [
      "gunicorn",
      "-k", "gthread",
      "-w", "4",
      "--threads", "2",
      "--bind", "0.0.0.0:5000",
      "--timeout", "120",
      "--keep-alive", "5",
      "--max-requests", "1000",
      "--max-requests-jitter", "100",
      "--preload",
      "wsgi:application"
    ]
    volumes:
      - ./db:/app/db
      - ./logs:/app/log
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # SocketIO server (separate process)
  ndart-socketio:
    build: .
    container_name: ndart-socketio
    ports:
      - "9031:5001" # SocketIO server
    environment:
      - FLASK_APP=socketio_server.py
      - FLASK_ENV=production
      - NDART_HOST=0.0.0.0
      - FLASK_PORT=5001
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - NDART_DEBUG=${NDART_DEBUG:-False}
      - LOGGING_PATH=/app/log
      - LOGGING_LEVEL=${LOGGING_LEVEL:-20}
    command: ["python", "socketio_server.py"]
    volumes:
      - ./db:/app/db
      - ./logs:/app/log
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    depends_on:
      - ndart-web

networks:
  default:
    name: ndart-hybrid-network
