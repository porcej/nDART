services:
  ndart:
    build: .
    container_name: ndart-production
    ports:
      - "9030:5000"
    environment:
      - FLASK_APP=wsgi_gevent.py
      - FLASK_ENV=production
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=5000
      - DATABASE_URL=sqlite:////app/db/app.db
      - SECRET_KEY=${SECRET_KEY}
      - NDART_DEBUG=False
      - NDART_HOST=0.0.0.0
      - FLASK_PORT=5000
      - LOGGING_PATH=/app/log
      - LOGGING_LEVEL=20
      - ASYNC_MODE=gevent
    volumes:
      # Persist database and logs on host filesystem
      - ./db:/app/db
      - ./logs:/app/log
      # To use your existing production database, uncomment and modify:
      # - /path/to/your/production/database.db:/app/db/app.db:ro  # Read-only
      # - /path/to/your/production/database.db:/app/db/app.db      # Read-write
    # Socket.IO needs a single gevent worker. Do NOT use --max-requests or
    # --preload: recycling the only worker can hang on exit and Cloudflare
    # returns 524 while Gunicorn waits for --timeout (120s).
    command: [
      "gunicorn",
      "-k", "gevent",
      "-w", "1",
      "--worker-connections", "1000",
      "--bind", "0.0.0.0:5000",
      "--timeout", "120",
      "--graceful-timeout", "30",
      "--keep-alive", "5",
      "wsgi_gevent:application"
    ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/live"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    # Resource limits for production
    #deploy:
      #resources:
       # limits:
       #   memory: 1G
       #   cpus: '1.0'
       # reservations:
       #   memory: 512M
       #   cpus: '0.5'

networks:
  default:
    name: ndart-production-network
