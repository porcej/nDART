services:
  ndart:
    build: .
    container_name: ndart-gunicorn
    ports:
      - "9030:5000"
    environment:
      - FLASK_APP=wsgi.py
      - FLASK_ENV=production
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=5000
      - DATABASE_URL=sqlite:////app/db/app.db
      - SECRET_KEY=${SECRET_KEY:-this-is-a-production-secret-key-change-this}
      - NDART_DEBUG=False
      - NDART_HOST=0.0.0.0
      - FLASK_PORT=5000
      - LOGGING_PATH=/app/log
      - LOGGING_LEVEL=20
    volumes:
      # Persist database and logs on host filesystem
      - ./db:/app/db
      - ./logs:/app/log
      # To use your existing production database, uncomment and modify:
      # - /path/to/your/production/database.db:/app/db/app.db:ro  # Read-only
      # - /path/to/your/production/database.db:/app/db/app.db      # Read-write
    command: ["python", "socketio_server.py"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    # Resource limits for production
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

networks:
  default:
    name: ndart-gunicorn-network